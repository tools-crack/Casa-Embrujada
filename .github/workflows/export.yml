name: Export Web
on:
  workflow_dispatch:
  push:
jobs:
  export-web:
    runs-on: ubuntu-22.04
    env:
      V: 3.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Find and unzip project
        run: |
          ls -la
          for z in *.zip; do unzip -o "$z" || true; done
          P=$(dirname "$(find . -name project.godot | head -n 1)")
          echo "PROJECT_DIR=$P" >> $GITHUB_ENV
          echo "Project folder: $P"
      - name: Install Godot and templates
        run: |
          G=https://github.com/godotengine/godot/releases/download/${V}-stable
          T=https://downloads.tuxfamily.org/godotengine/${V}
          wget -q "$G/Godot_v${V}-stable_linux_headless.64.zip" || wget -q "$T/Godot_v${V}-stable_linux_headless.64.zip"
          wget -q "$G/Godot_v${V}-stable_export_templates.tpz" || wget -q "$T/Godot_v${V}-stable_export_templates.tpz"
          unzip -q Godot_v${V}-stable_linux_headless.64.zip
          chmod +x Godot_v${V}-stable_linux_headless.64
          sudo mv Godot_v${V}-stable_linux_headless.64 /usr/local/bin/godot
          unzip -q Godot_v${V}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/${V}.stable
          mv templates/* ~/.local/share/godot/templates/${V}.stable/
          godot --version
      - name: Export HTML5
        run: |
          cd "$PROJECT_DIR"
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="HTML5"
          platform="HTML5"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          script_export_mode=0
          script_encryption_key=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/export_type=0
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resizing_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          EOF
          timeout 120 godot --path . --editor --quit || true
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          godot --path . --export "HTML5" "$GITHUB_WORKSPACE/build/web/index.html"
          ls -la "$GITHUB_WORKSPACE/build/web"
      - uses: actions/upload-artifact@v4
        with:
          name: casa-embrujada-web
          path: build/web
          if-no-files-found: error
