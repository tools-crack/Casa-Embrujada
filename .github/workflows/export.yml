name: Export Web
on:
  workflow_dispatch:
  push:
jobs:
  export-web:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:3.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o CasaEmbrujada_godot353.zip
      - name: Setup templates
        run: |
          mkdir -v -p ~/.local/share/godot/templates
          cp -r /root/.local/share/godot/templates/3.5.3.stable ~/.local/share/godot/templates/ || true
      - name: Export
        working-directory: CasaEmbrujada
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="HTML5"
          platform="HTML5"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/web/index.html"
          script_export_mode=1
          script_encryption_key=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/export_type=0
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resizing_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          EOF
          godot -v --path . --editor --quit || true
          mkdir -v -p ../build/web
          godot -v --path . --export "HTML5" ../build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: casa-embrujada-web
          path: build/web
